[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketnlp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.5,<3", "transformers>=4.45,<5", "scikit-learn>=1.5,<2", "matplotlib>=3.9,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["ticketnlp*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
